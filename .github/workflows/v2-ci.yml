name: Raseed V2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raseed
          POSTGRES_PASSWORD: raseed_test
          POSTGRES_DB: raseed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raseed -d raseed_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://raseed:raseed_test@localhost:5432/raseed_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check backend tests database
      - run: uv run ruff format --check backend tests database
      - run: uv run mypy backend
      - run: uv run pytest --cov=backend/app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raseed
          POSTGRES_PASSWORD: raseed_test
          POSTGRES_DB: raseed_browser_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raseed -d raseed_browser_demo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DEMO_E2E_DATABASE_URL: postgresql+psycopg://raseed:raseed_test@127.0.0.1:5432/raseed_browser_demo
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: apps/web/test-results
