[project]
name = "raseed-v2"
version = "0.1.0"
description = "Raseed V2 modular backend"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "babel>=2.16,<3",
  "fastapi>=0.121,<1",
  "firebase-admin>=6.6,<8",
  "google-cloud-storage>=3,<4",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL test database"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["backend/**/*.py", "tests/**/*.py", "database/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["backend"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.auth.*", "google.cloud.*"]
ignore_missing_imports = true
