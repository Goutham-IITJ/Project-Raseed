services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: raseed
      POSTGRES_PASSWORD: raseed_local
      POSTGRES_DB: raseed
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - raseed_postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raseed -d raseed"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  raseed_postgres:
